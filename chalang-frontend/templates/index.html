
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YARD Portal</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:#070812;
    color:#fff;
    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   AURORA BACKGROUND
========================= */
.aurora{
    position:absolute;
    inset:-20%;
    background:
    radial-gradient(40% 40% at 20% 30%, rgba(124,92,255,.45), transparent 60%),
    radial-gradient(35% 35% at 80% 70%, rgba(0,240,255,.45), transparent 60%),
    radial-gradient(30% 30% at 50% 50%, rgba(255,0,247,.35), transparent 60%);

    filter:blur(90px);
    animation:drift 20s ease-in-out infinite alternate;
}

@keyframes drift{
    0%{transform:translate(0,0)}
    100%{transform:translate(-80px,60px)}
}

/* =========================
   FLOW LINES
========================= */
.wave{
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
        120deg,
        rgba(0,240,255,0.04) 0px,
        rgba(0,240,255,0.04) 2px,
        transparent 2px,
        transparent 20px
    );

    animation:waveMove 12s linear infinite;
}

@keyframes waveMove{
    from{transform:translateX(0)}
    to{transform:translateX(200px)}
}

/* =========================
   ORBIT RINGS
========================= */
.ring{
    position:absolute;
    border:1px solid rgba(124,92,255,0.18);
    border-radius:50%;
    animation:rotate 20s linear infinite;
}

.r1{
    width:300px;
    height:300px;
    top:18%;
    left:62%;
}

.r2{
    width:200px;
    height:200px;
    top:60%;
    left:15%;
    animation-duration:15s;
}

@keyframes rotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

/* =========================
   NETWORK CANVAS
========================= */
canvas{
    position:absolute;
    inset:0;
}

/* =========================
   GLASS CARD
========================= */
.card{
    position:absolute;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:380px;
    max-width:92%;

    padding:30px;

    border-radius:24px;

    background:rgba(255,255,255,.06);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 20px 50px rgba(0,0,0,.5),
    0 0 40px rgba(124,92,255,.15);

    z-index:20;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.hidden-card{
    opacity:0;
    transform:translateY(60px) scale(0.95);
    filter:blur(10px);

    transition:
    opacity .8s ease,
    transform .8s ease,
    filter .8s ease;
}

.show-card{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:24px;
    padding:1px;

    background:linear-gradient(45deg,#7c5cff,#00f0ff,#ff00f7);

    -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

.logo{
    text-align:center;
    font-size:40px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#c9c9c9;
    font-size:14px;
    margin-bottom:24px;
}

.input-box{
    margin-bottom:16px;
}

.input-box input,
.input-box select{
    width:100%;
    padding:14px;

    border-radius:12px;
    border:1px solid transparent;

    background:rgba(255,255,255,.08);
    color:#fff;

    outline:none;
    transition:.25s ease;

    font-size:15px;
}

.input-box input::placeholder{
    color:#d2d2d2;
}

.input-box input:focus,
.input-box select:focus{
    border-color:#7c5cff;
    background:rgba(255,255,255,.12);
    box-shadow:0 0 15px rgba(124,92,255,.3);
}

select option{
    background:#111827;
}

button{
    width:100%;
    padding:14px;

    border:none;
    border-radius:12px;

    background:linear-gradient(45deg,#7c5cff,#00f0ff);

    color:white;
    font-size:15px;
    font-weight:600;

    cursor:pointer;
    transition:.25s ease;
}

button:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 0 25px rgba(124,92,255,.6);
}

.footer{
    text-align:center;
    margin-top:18px;
    font-size:12px;
    color:#b7b7b7;
}

/* =========================
   TYPING OVERLAY
========================= */
#overlay{
    position:absolute;
    bottom:20px;
    left:20px;

    color:#00f0ff;
    font-size:14px;

    opacity:.7;
    font-family:monospace;

    z-index:5;
}

/* =========================
   MOBILE
========================= */
@media(max-width:480px){
    .card{
        width:92%;
        padding:24px;
    }

    h1{
        font-size:24px;
    }
}
</style>

</head>
<body>

<div class="aurora"></div>
<div class="wave"></div>
<div class="ring r1"></div>
<div class="ring r2"></div>

<canvas id="net"></canvas>

<!-- =========================
     LOGIN CARD
========================= -->
<div class="card">

    <div class="logo">🚀</div>

    <h1>YARD Portal</h1>

    <div class="subtitle">
        Youth Academic & Resource Directory
    </div>

    <div class="input-box">
        <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-box">
        <input type="email" id="email" placeholder="Email Address">
    </div>

    <div class="input-box">
        <input type="password" id="password" placeholder="Password">
    </div>

    <div class="input-box">
        <select id="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>
    </div>

    <div style="display: flex; gap: 10px; width: 100%;">
        <button onclick="loginUser()" style="flex: 1;">
            Enter Portal
        </button>
        <button onclick="registerUser()" style="flex: 1; background: linear-gradient(45deg, #00f0ff, #ff00f7);">
            Register
        </button>
    </div>

    <div class="footer">
        Aurora • Neural • Futuristic UI
    </div>

</div>

<!-- =========================
     OVERLAY
========================= -->
<div id="overlay">
    <span id="typing"></span>
</div>

<script>

/* =========================
   CANVAS NETWORK
========================= */
const c = document.getElementById('net');
const ctx = c.getContext('2d');

let w,h;
let pts=[];
const N=55;

let mouse={x:window.innerWidth/2,y:window.innerHeight/2};
let trail=[];
let particles=[];

function resize(){
    w=c.width=window.innerWidth;
    h=c.height=window.innerHeight;
}

resize();
window.addEventListener('resize',resize);

for(let i=0;i<N;i++){
    pts.push({
        x:Math.random()*w,
        y:Math.random()*h,
        vx:(Math.random()-.5)*.5,
        vy:(Math.random()-.5)*.5
    });
}

for(let i=0;i<22;i++){
    particles.push({
        x:Math.random()*w,
        y:Math.random()*h,
        vx:0,
        vy:0
    });
}

window.addEventListener('mousemove',e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;

    trail.push({
        x:e.clientX,
        y:e.clientY,
        life:1
    });
});

function animate(){

    ctx.clearRect(0,0,w,h);

    // ===== NETWORK =====
    for(const p of pts){

        p.x += p.vx;
        p.y += p.vy;

        if(p.x<0 || p.x>w) p.vx *= -1;
        if(p.y<0 || p.y>h) p.vy *= -1;
    }

    for(let i=0;i<N;i++){

        for(let j=i+1;j<N;j++){

            const a=pts[i];
            const b=pts[j];

            const d=Math.hypot(a.x-b.x,a.y-b.y);

            if(d<110){
                ctx.strokeStyle=`rgba(0,240,255,${(1-d/110)*0.25})`;
                ctx.beginPath();
                ctx.moveTo(a.x,a.y);
                ctx.lineTo(b.x,b.y);
                ctx.stroke();
            }
        }

        const dm=Math.hypot(pts[i].x-mouse.x,pts[i].y-mouse.y);

        if(dm<140){
            ctx.strokeStyle=`rgba(124,92,255,${(1-dm/140)*0.55})`;
            ctx.beginPath();
            ctx.moveTo(pts[i].x,pts[i].y);
            ctx.lineTo(mouse.x,mouse.y);
            ctx.stroke();
        }

        ctx.fillStyle='rgba(255,255,255,.8)';
        ctx.beginPath();
        ctx.arc(pts[i].x,pts[i].y,1.4,0,Math.PI*2);
        ctx.fill();
    }

    // ===== CURSOR TRAIL =====
    for(let i=0;i<trail.length;i++){

        const t=trail[i];

        ctx.fillStyle=`rgba(124,92,255,${t.life})`;

        ctx.beginPath();
        ctx.arc(t.x,t.y,3,0,Math.PI*2);
        ctx.fill();

        t.life -= 0.03;
    }

    trail = trail.filter(t=>t.life>0);

    // ===== FLOATING PARTICLES =====
    for(const p of particles){

        const dx=mouse.x-p.x;
        const dy=mouse.y-p.y;
        const dist=Math.hypot(dx,dy)||1;

        p.vx += dx/dist * 0.03;
        p.vy += dy/dist * 0.03;

        p.vx *= 0.95;
        p.vy *= 0.95;

        p.x += p.vx;
        p.y += p.vy;

        ctx.fillStyle='rgba(0,240,255,0.6)';

        ctx.beginPath();
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fill();
    }

    // ===== AI CORE =====
    const cx=w/2;
    const cy=h/2;

    const dx=mouse.x-cx;
    const dy=mouse.y-cy;

    const dist=Math.hypot(dx,dy);
    const maxDist=Math.hypot(w/2,h/2);

    const intensity=1-dist/maxDist;

    const radius=40+intensity*25;

    const gradient=ctx.createRadialGradient(cx,cy,0,cx,cy,radius);

    gradient.addColorStop(0,`rgba(124,92,255,${0.45*intensity})`);
    gradient.addColorStop(1,'transparent');

    ctx.fillStyle=gradient;

    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,Math.PI*2);
    ctx.fill();

    requestAnimationFrame(animate);
}

animate();

/* =========================
   TYPING EFFECT
========================= */
const text="Initializing YARD System... Neural Core Active...";
let i=0;

function typeEffect(){

    if(i<text.length){
        document.getElementById('typing').innerHTML += text.charAt(i);
        i++;
        setTimeout(typeEffect,40);
    }
}

typeEffect();

/* =========================
   LOGIN REDIRECTION
========================= */
function loginUser(){

    const username=document.getElementById('username').value.trim();
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value.trim();
    const role=document.getElementById('role').value;

    if(email==='' || password===''){
        alert('Please fill email and password');
        return;
    }

    fetch(`http://localhost:8080/auth/login?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
        method: 'POST'
    })
    .then(res => {
        if (res.ok) {
            alert('Login successful!');
            if(role==='admin'){
                window.location.href='/admin';
            }
            else{
                window.location.href='/yard';
            }
        } else {
            alert('Invalid credentials! Please register if you do not have an account.');
        }
    })
    .catch(err => {
        console.error(err);
        alert('Error connecting to backend auth API.');
    });
}

function registerUser(){
    const username=document.getElementById('username').value.trim();
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value.trim();
    const role=document.getElementById('role').value;

    if(username==='' || email==='' || password===''){
        alert('Please fill all fields to register');
        return;
    }

    fetch('http://localhost:8080/auth/register', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            name: username,
            email: email,
            password: password,
            department: role
        })
    })
    .then(res => {
        if (res.ok) {
            alert('Registration successful! You can now log in.');
        } else {
            alert('Registration failed.');
        }
    })
    .catch(err => {
        console.error(err);
        alert('Error connecting to backend registration API.');
    });
}
</script>
</body>
</html>
