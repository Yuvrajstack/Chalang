<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YARD Opportunities</title>
    <link rel="stylesheet" href="user.css">
</head>
<body>

<!-- Background Glow -->
<div class="bg-glow"></div>

<header>
    <h1>🚀 YARD Opportunities</h1>
    <p>Find internships, scholarships & hackathons</p>
</header>

<!-- Search + Filter -->
<div class="controls">
    <input type="text" id="search" placeholder="🔍 Search opportunities...">
    
    <select id="filter">
        <option value="all">All</option>
        <option value="Internship">Internship</option>
        <option value="Scholarship">Scholarship</option>
        <option value="Hackathon">Hackathon</option>
    </select>
</div>

<!-- Opportunities -->
<div id="opportunityList" class="opportunity-list"></div>

<script src="user.js"></script>
</body>
</html>
