<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YARD Opportunities</title>
    <link rel="stylesheet" href="opportunity.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>YARD - Opportunities</h1>
        <p>Explore and share academic & career opportunities</p>
    </header>

    <!-- Search + Filter -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search opportunities...">
        <select id="filterCategory">
            <option value="">All Categories</option>
            <option value="Internship">Internship</option>
            <option value="Scholarship">Scholarship</option>
            <option value="Competition">Competition</option>
            <option value="Workshop">Workshop</option>
        </select>
    </div>

    <!-- Add Opportunity Form -->
    <div class="form-container">
        <h2>Add Opportunity</h2>

        <label>Title</label>
        <input type="text" id="title" placeholder="Enter title">

        <label>Category</label>
        <input type="text" id="category" placeholder="Enter category">

        <label>Link</label>
        <input type="text" id="link" placeholder="Enter link">

        <label>Description</label>
        <textarea id="description" placeholder="Enter description"></textarea>

        <button onclick="addOpportunity()">Add Opportunity</button>
    </div>

    <!-- Opportunities List -->
    <div class="list-container">
        <h2>Available Opportunities</h2>

        <div id="opportunityList" class="cards-container">
            <!-- Cards will be added here dynamically -->
        </div>
    </div>

    <!-- Template Card (JS will use this structure) -->
    <template id="cardTemplate">
        <div class="card">
            <h3 class="card-title"></h3>
            <p class="card-category"></p>
            <p class="card-description"></p>
            <a class="card-link" target="_blank">Apply Now</a>

            <div class="card-actions">
                <button class="edit-btn">Edit</button>
                <button class="delete-btn">Delete</button>
            </div>
        </div>
    </template>

    <script src="opportunity.js"></script>
</body>
</html>
